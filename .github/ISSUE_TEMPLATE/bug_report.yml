name: 🐛 Bug Report
description: Report a pricing inaccuracy, UI anomaly, or unexpected behavior in Albion Wizard.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Albion Wizard more accurate and reliable! Please provide as much context as possible.

  - type: dropdown
    id: cluster
    attributes:
      label: Albion Server Cluster
      description: Which live Albion Online server cluster were you targeting?
      options:
        - Americas (West)
        - Europe (Europe)
        - Asia (East)
    validations:
      required: true

  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Subsystem
      description: Which economic module or UI component encountered the bug?
      options:
        - Black Market Arbitrage Cards
        - Transport Manifest Drawer (Cart)
        - 700/700 Focus Refining & Crafting Lab
        - +EV Quality Reroll Simulator
        - Faction Matrix (Hearts / Crests)
        - Gold-Silver Macro Oracle & Patch Tracker
        - Web Audio Alerts / Synthesizer
        - Filter & Search System
        - General UI / Responsive Layout
    validations:
      required: true

  - type: input
    id: item_id
    attributes:
      label: Item ID or Name (If applicable)
      description: E.g., T6_2H_CLAYMORE@1, T8_MAIN_SWORD, or "Treeheart".
      placeholder: T6_2H_CLAYMORE@1

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exactly how can we reproduce this behavior?
      placeholder: |
        1. Open https://albion-wizard.xandred.workers.dev/
        2. Select Europe cluster.
        3. Filter by Tier 6.
        4. Observe discrepancy between in-game market and displayed price.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / OS
      description: E.g. Chrome 124 on Windows 11, Firefox on Linux.
      placeholder: Chrome 124 on Ubuntu Linux
